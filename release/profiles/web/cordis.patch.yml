# Versioned production Web profile. Mutable settings and credentials stay in DSH_HOME.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

- id: connection
  config:
    trustedHosts:
      - '192.168.6.240:3080'
      - 'dsh.man-her.icu'

- id: compaction-basic
  disabled: false
  config:
    auto: true
    thresholdRatio: 0.5
    retainRatio: 0.12
- id: command-compact
  disabled: false

- id: session-persistence-jsonl
  disabled: true
- insert:
    - id: session-persistence-sqlite
      name: '@deepseek-ai/dsh-session-persistence-sqlite'
      config:
        path: !!js dshHomePath('storages/session-persistence.sqlite')

- id: session-query-sqlite
  config:
    path: !!js dshHomePath('storages/session-query.sqlite')
    openAt: first-search

- insert:
    - id: tool-session-query
      name: '@deepseek-ai/dsh-tool-session-query'
    - id: personal-feed-selector
      name: '@herman/personal-feed-selector'
      config:
        mode: web
    - id: dsh-cron
      name: '@deepseek-ai/dsh-cron'
      config:
        mode: manager
        managedCommandBindings:
          - externalRef: dsh:notion-task-inbox:retry:v1
            schedule:
              kind: interval
              minutes: 5
            command:
              argv:
                - /usr/bin/python3
                - /home/herman/.dsh/workspace/automations/notion/notion_inbox_sync.py
                - --retry-pending
                - --json
              timeoutSeconds: 120
              outputMaxBytes: 4096
            deliver: silent
            cwd: /home/herman/.dsh/workspace
    - id: dsh-assistant
      name: '@deepseek-ai/dsh-assistant'
      config:
        mode: web
