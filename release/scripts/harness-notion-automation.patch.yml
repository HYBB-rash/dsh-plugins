# Last-layer lockdown for the one-shot Notion automation authoring task.
# The task gets native filesystem tools plus bounded foreground bash execution
# inside the workspace-write sandbox.

- id: tools
  config:
    mode: native
    maxParallelSubCalls: 1

- id: agent-loop
  config:
    agents: []
    maxParallelToolCalls: 1

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    baseURL: http://deepseek-relay:8080
    thinking: enabled
    reasoningEffort: low
    maxTokens: 65536
    retryPolicy:
      mode: normal
      maxRetries: 0
    models:
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
        contextWindow: 1000000
        maxTokens: 65536
        inputModalities:
          - text

- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: /work

- id: approval
  config:
    policy: never

- id: permission
  disabled: true
- id: shell-env

