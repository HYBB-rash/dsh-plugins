name: dsh

x-dsh-common: &dsh-common
  image: ${DSH_IMAGE:?DSH_IMAGE must name the admitted immutable image}
  user: "1000:1000"
  read_only: true
  restart: unless-stopped
  environment:
    HOME: /home/herman
    DSH_HOME: /home/herman/.dsh
    DSH_CWD: /home/herman/.dsh/workspace
    TZ: Asia/Shanghai
    DSH_IMAGE_ID: ${DSH_IMAGE_ID:?DSH_IMAGE_ID is required}
    DSH_X_FEED_DATA_DIR: /home/herman/.dsh/storages/dsh-x-feed
    TINI_SUBREAPER: "1"
  volumes:
    - /home/herman:/home/herman:rw
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m
    - /run:rw,nosuid,size=64m
    - /home/herman/.openclaw:rw,noexec,nosuid,size=1m
    - /home/herman/task-inbox-workflow:rw,noexec,nosuid,size=1m
  pids_limit: 256
  mem_limit: 1g

services:
  prepare:
    <<: *dsh-common
    container_name: dsh-prepare
    restart: "no"
    cap_drop: ["ALL"]
    command: ["prepare"]

  web:
    <<: *dsh-common
    container_name: dsh-web
    network_mode: host
    cap_drop: ["ALL"]
    command: ["web"]
    depends_on:
      prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:3080/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  lan-proxy:
    <<: *dsh-common
    container_name: dsh-lan-proxy
    network_mode: host
    cap_drop: ["ALL"]
    command: ["lan-proxy"]
    mem_limit: 64m
    pids_limit: 256
    depends_on:
      web:
        condition: service_healthy

  telegram:
    <<: *dsh-common
    container_name: dsh-telegram
    network_mode: host
    pid: host
    privileged: true
    volumes:
      - /home/herman:/home/herman:rw
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:rw
    command: ["telegram"]
    depends_on:
      web:
        condition: service_healthy
