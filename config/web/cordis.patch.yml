- id: telegram-gateway
  config:
    sessionId: session-telegram
    agentPreset: standard
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
    extensions:
      - modulePath: '@herman/personal-feed'
        configJson: '{"telegramSessionId":"session-telegram"}'

- id: dsh-cron
  config:
    mode: scheduler
    pollIntervalMs: 10000
    maxConcurrent: 3
    deliverOnError: true

- id: dsh-assistant
  config:
    mode: telegram
    pollIntervalMs: 5000
    telegramParentSessionId: session-telegram
    cronControlSocketPath: !!js dshHomePath('storages/dsh-cron/control.sock')
