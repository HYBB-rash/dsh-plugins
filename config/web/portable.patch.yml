# Versioned runtime overrides for the portable Web package.
- id: telegram-gateway
  config:
    sessionId: session-telegram
    agentPreset: standard
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: dsh-cron
  config:
    mode: scheduler
    agentPreset: standard
    pollIntervalMs: 10000
    maxConcurrent: 3
    deliverOnError: true

- insert:
    - id: dsh-cron-manager
      name: '@deepseek-ai/dsh-cron'
      config:
        mode: manager
        controlSocketPath: !!js dshHomePath('storages/dsh-cron/control.sock')

- id: dsh-assistant
  config:
    mode: telegram
    pollIntervalMs: 5000
    telegramParentSessionId: session-telegram
    cronControlSocketPath: !!js dshHomePath('storages/dsh-cron/control.sock')
